name: Validate and package Windows game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run simulate -- --runs 8 --seconds 30 --report artifacts/ci-simulation.json
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Jurassic-Domination-Windows
          path: |
            release/*portable.exe
            release/win-unpacked/**
            artifacts/ci-simulation.json
          if-no-files-found: error
